<div class="filter-controls">
  <button
    #filterButton
    class="filter-button"
    type="button"
    (click)="toggleFilters()"
    aria-label="Filters"
    title="Filters"
  >
    <svg
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
      focusable="false"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 4h18l-7 9v6l-4-2v-4z" />
    </svg>
  </button>
  @if (showFilters) {
    <div class="filters-panel" #filtersPanel>
      @if (filterContent) {
        <ng-container *ngTemplateOutlet="filterContent"></ng-container>
      }
    </div>
  }
</div>
